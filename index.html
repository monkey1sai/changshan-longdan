<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2338bdf8'/%3E%3C/svg%3E" />
    <title>Game</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        background: #020617;
        color: #94a3b8;
        font-family: system-ui, sans-serif;
      }

      canvas {
        max-width: 100vw;
        height: auto;
        border-radius: 8px;
      }

      p {
        margin: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="450"></canvas>
    <p>方向鍵或 WASD 移動</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
