name: Game CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, typecheck and build
        run: npm run check
      - name: Capture E01 production-kernel traces without changing gameplay
        id: e01_trace
        run: npm run trace:baseline -- --out release/e01/ci-capture
      - name: Preserve E01 traces and scoped profile for review
        if: ${{ always() && (steps.e01_trace.outcome == 'success' || steps.e01_trace.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e01-kernel-${{ matrix.os }}
          path: release/e01/ci-capture/
          if-no-files-found: error
          retention-days: 7
      - name: Validate itch.io package without publishing
        run: node scripts/package-itch.mjs
      - name: Verify tracked files are unchanged
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
