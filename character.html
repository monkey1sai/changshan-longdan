<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>趙雲 · 角色工坊</title>
  <style>
    * { box-sizing: border-box } body { margin:0; background:#111820; color:#e7e5db; font:15px/1.7 system-ui,sans-serif }
    canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none }
    aside { position:absolute; top:32px; left:36px; width:260px; pointer-events:none }
    .eyebrow { font-size:11px; letter-spacing:4px; color:#baaa79 } h1 { font:500 44px/1.3 serif; letter-spacing:8px; margin:18px 0 8px }
    p { color:#aab4ba; font-size:13px } .rule { width:44px; height:2px; background:#b9a36c; margin:24px 0 }
    fieldset { border:0; padding:0; margin:20px 0; pointer-events:auto } legend { font-size:11px; letter-spacing:2px; color:#8a979e; margin-bottom:10px }
    button,a { display:inline-block; background:#1e2932; color:#c8d0d1; border:1px solid #37454f; padding:8px 12px; margin:0 5px 7px 0; cursor:pointer; font:inherit; font-size:12px; text-decoration:none }
    button[aria-pressed=true] { color:#f5e2ae; border-color:#ac935e; background:#30312c }
    footer { position:absolute; bottom:12px; left:36px; right:36px; display:flex; justify-content:space-between; color:#8a979e; font-size:10px; letter-spacing:1px; pointer-events:none }
    #status { color:#bacaaf } .note { max-width:240px }
    @media(max-width:700px) {
      body { overflow:hidden } aside { left:12px; top:auto; bottom:12px; width:calc(100% - 24px); padding:12px; background:#141e28eb; border:1px solid #37454f }
      h1 { font-size:22px; margin:0 0 7px; letter-spacing:4px } .eyebrow,.rule,.note,aside > p:not(#status),legend,footer { display:none }
      fieldset { margin:0 0 3px } button,a { padding:5px 7px; margin:0 3px 3px 0; font-size:11px } #status { font-size:11px; margin:3px 0 }
    }
  </style>
</head>
<body>
  <canvas id="preview"></canvas>
  <aside>
    <div class="eyebrow">CHANGSHAN · CHARACTER STUDY</div>
    <h1>趙雲</h1>
    <p>銀甲綠袍 · 角色樣板 01</p>
    <div class="rule"></div>
    <fieldset id="model-options"><legend>模型對照</legend><button data-model="refined" aria-pressed="true">精細角色</button><button data-model="voxel" aria-pressed="false">原始體素</button></fieldset>
    <fieldset id="pose-options"><legend>動作檢查</legend><button data-pose="stance" aria-pressed="true">持槍</button><button data-pose="run">跑步</button><button data-pose="N1">揮槍</button><button data-pose="C3">蓄力</button><button data-pose="guard">防禦</button><button data-pose="dodge">翻滾</button></fieldset>
    <fieldset><legend>觀看</legend><button id="close-up">臉部近看</button><button id="full-body">全身</button><button id="freeze" aria-pressed="false">暫停動作</button></fieldset>
    <p id="status" role="status">載入角色…</p>
    <p class="note">拖曳旋轉 · 滾輪縮放<br>使用中性棚光，檢查模型輪廓與材質。</p>
    <a href="./" style="pointer-events:auto">進入戰場 →</a>
  </aside>
  <footer><span>QUATERNIUS BASE · CC0 / BLENDER → glTF</span><span>常山龍膽 / 人物先行</span></footer>
  <script type="module" src="/src/view/character-preview.ts"></script>
</body>
</html>
